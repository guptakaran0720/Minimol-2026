name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (exit code 5 = no tests collected yet, allowed)
        run: pytest -q || [ $? -eq 5 ]
